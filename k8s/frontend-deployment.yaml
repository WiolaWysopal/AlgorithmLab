apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: algorithmlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: algorithmlab-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
