apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: algorithmlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: algorithmlab-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: algorithmlab-config
            - secretRef:
                name: algorithmlab-secret
